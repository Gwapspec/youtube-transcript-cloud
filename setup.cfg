[metadata]
name = youtube-transcript-cloud
version = 0.1.0
description = YouTube transcripts that work from cloud servers (AWS, GCP, Azure, Colab): timed snippets, auto-caption labels, coverage.
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
author = Honest Data
url = https://github.com/Gwapspec/youtube-transcript-cloud
project_urls =
    Hosted tool = https://apify.com/honestdata/youtube-transcript-scraper
keywords = youtube, transcript, captions, subtitles, youtube-transcript-api, apify, rag
classifiers =
    Programming Language :: Python :: 3
    License :: OSI Approved :: MIT License
    Topic :: Multimedia :: Video

[options]
packages = youtube_transcript_cloud
python_requires = >=3.8
